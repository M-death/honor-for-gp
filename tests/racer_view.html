<!doctype html><meta charset="utf-8"><title>racer view</title>
<style>body{margin:0;background:#9cc}</style>
<script type="importmap">{"imports":{"three":"../hfgp3d/viewer/vendor/three.module.js"}}</script>
<script type="module">
// d369 test page: the 6 racers close up (tests/racer_view.html?tier=mobile|pc1080ti&pose=cruise|turn&livery=standard|naniwa|lane&night=1)
import * as THREE from 'three';
import { loadAssetSet } from '../hfgp3d/runtime/boat_actor.js';
const q = new URLSearchParams(location.search), tier = q.get('tier') || 'mobile', pose = q.get('pose') || 'cruise', side = +(q.get('yaw') || 0.6);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(1600, 900); r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color('#a9cfe0');
sc.add(new THREE.HemisphereLight('#ffffff', '#5a7080', 1.6)); const sun = new THREE.DirectionalLight('#fff4e0', 2.4); sun.position.set(5, 10, 6); sc.add(sun);
const night = q.get('night') === '1'; if (night) { sc.background = new THREE.Color('#0b1220'); sc.children[0].intensity = .35; sc.children[1].intensity = 1.1; }
try { const es = new THREE.Scene(), sg = new THREE.SphereGeometry(50, 32, 16), col = []; for (let i = 0; i < sg.attributes.position.count; i++) { const y = sg.attributes.position.getY(i) / 50; const c = new THREE.Color(y > 0 ? '#bfe0f5' : '#4a6070').lerp(new THREE.Color('#ffffff'), Math.max(0, y) ** 4); col.push(c.r, c.g, c.b); } sg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); es.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide }))); sc.environment = new THREE.PMREMGenerator(r).fromScene(es, .02).texture; sc.environmentIntensity = night ? .25 : .6; } catch (e) {}
const cam = new THREE.PerspectiveCamera(30, 16 / 9, .1, 100);
const set = await loadAssetSet('../hfgp3d/', tier);
for (let i = 0; i < 6; i++) {
  const a = set.create({ lane: i + 1, sex: i % 2 ? 'f' : 'm', heightCm: 165 }); a.setSuit('racer' + i); if (a.setLivery) a.setLivery(q.get('livery') || 'standard');
  a.setGameTransform({ x: (i - 2.5) * 2.1, y: 0, modelYaw: side }); a.setLOD(0);
  a.updatePose(pose === 'turn' ? { roll: -0.9, pitch: 0.3, turn: 1, steer: -.4, wheel: -.5 } : { pitch: .5 });
  sc.add(a.root);
}
const cz = +(q.get('dist') || 9.5); cam.position.set(0, 3.2 * cz / 9.5, cz); cam.lookAt(0, .5, 0); cam.fov = cz > 12 ? 30 : 40; cam.updateProjectionMatrix();
r.render(sc, cam); window.done = true;
</script>
